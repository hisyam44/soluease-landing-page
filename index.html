<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Soluease is a Batam-based software house delivering web, mobile, and cloud solutions with ease. Partner with us for design, development, and secure digital products."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.soluease.com/" />
    <meta
      property="og:title"
      content="Soluease - Digital Solutions with Ease"
    />
    <meta
      property="og:description"
      content="High-end web, mobile, and cloud solutions from a Batam software house focused on fast delivery, quality, and security."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.soluease.com/" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Soluease - Digital Solutions with Ease"
    />
    <meta
      name="twitter:description"
      content="Web, mobile, and cloud products built quickly and securely by Soluease in Batam, Indonesia."
    />
    <meta name="twitter:image" content="/logo.png" />
    <meta name="theme-color" content="#1d97c1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Soluease" />
    <meta name="apple-mobile-web-app-icons" content="/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" href="/icon-192x192.png" />
    <title>Soluease - Digital Solutions with Ease</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        scroll-behavior: smooth;
      }
      h1,
      h2,
      h3,
      .font-heading {
        font-family: "Space Grotesk", sans-serif;
      }
      .bg-primary {
        background-color: #1d97c1;
      }
      .text-primary {
        color: #1d97c1;
      }
      .border-primary {
        border-color: #1d97c1;
      }
      .glow {
        box-shadow: 0 0 20px rgba(29, 151, 193, 0.3);
      }
      .gradient-mesh {
        background-color: #f8fafc;
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(29, 151, 193, 0.1) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 100%,
            rgba(29, 151, 193, 0.05) 0px,
            transparent 50%
          );
      }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.soluease.com/#organization",
        "name": "Soluease",
        "url": "https://www.soluease.com/",
        "logo": "https://www.soluease.com/logo.png",
        "description": "Software house in Batam, Indonesia delivering web, mobile, and gamification with ease.",
        "foundingDate": "2018",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Batam",
          "addressRegion": "Riau Islands",
          "addressCountry": "ID"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "telephone": "+62-778-123-4567",
          "email": "hello@soluease.com"
        },
        "sameAs": [
          "https://www.linkedin.com/company/soluease",
          "https://www.instagram.com/soluease",
          "https://twitter.com/soluease"
        ]
      }
    </script>
  </head>
  <body
    class="bg-slate-50 text-slate-900 selection:bg-[#1d97c1] selection:text-white"
  >
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
